<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Birthday Surprise! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* ==================== LOGIN SCREEN ==================== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: fadeIn 0.6s ease-in;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideUp 0.8s ease-out;
        }

        .login-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 30px;
            border: 5px solid #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            animation: photoFloat 3s ease-in-out infinite;
        }

        .login-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .login-subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .passcode-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 5px;
            transition: border-color 0.3s;
        }

        .passcode-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            min-height: 20px;
            animation: shake 0.5s;
        }

        /* ==================== LOADING SCREEN ==================== */
        .loading-container {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-direction: column;
            animation: fadeIn 0.6s ease-in;
        }

        .loading-container.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        .loading-text {
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .dots {
            display: inline-block;
            animation: dots 1.4s infinite;
        }

        /* ==================== CELEBRATION SCREEN ==================== */
        .celebration-container {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #48dbfb 100%);
            flex-direction: column;
            animation: fadeIn 0.6s ease-in;
            position: relative;
            overflow: hidden;
        }

        .celebration-container.active {
            display: flex;
        }

        .celebration-content {
            text-align: center;
            z-index: 10;
            animation: slideUp 0.8s ease-out;
        }

        .birthday-message {
            font-size: 48px;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: bounce 1s ease-in-out infinite;
        }

        .personalized-message {
            font-size: 24px;
            color: white;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            line-height: 1.6;
            animation: fadeInScale 1s ease-out 0.3s both;
        }

        .cake-container {
            margin: 40px 0;
            animation: cakeDrop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
        }

        /* ==================== CAKE ANIMATION ==================== */
        .cake {
            width: 120px;
            margin: 0 auto;
            position: relative;
        }

        .cake-base {
            width: 120px;
            height: 80px;
            background: linear-gradient(to right, #d4a574 0%, #f4d4a6 50%, #d4a574 100%);
            border-radius: 10px 10px 0 0;
            margin: 0 auto;
            box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .cake-layer {
            width: 120px;
            height: 25px;
            background: linear-gradient(to bottom, #a0522d 0%, #8b4513 100%);
            margin: 0 auto;
            position: relative;
            box-shadow: 0 -2px 5px rgba(255, 255, 255, 0.3);
        }

        .frosting {
            width: 130px;
            height: 20px;
            background: linear-gradient(to bottom, #ff69b4 0%, #ff1493 100%);
            margin: -10px auto 0;
            border-radius: 50%;
            filter: blur(2px);
        }

        .candle {
            width: 4px;
            height: 30px;
            background: #ffd700;
            margin: -25px auto 0;
            border-radius: 2px;
            animation: candleWave 2s ease-in-out infinite;
        }

        .flame {
            width: 8px;
            height: 15px;
            background: radial-gradient(ellipse at center, #ff6b00 0%, #ff0000 50%, #ffff00 100%);
            margin: -15px auto 0;
            border-radius: 50% 50% 50% 0;
            animation: flameFlicker 0.3s ease-in-out infinite;
            filter: blur(1px);
        }

        /* ==================== CONFETTI ==================== */
        .confetti {
            position: fixed;
            pointer-events: none;
            width: 10px;
            height: 10px;
            animation: confettiFall 3s linear infinite;
        }

        /* ==================== PARTICLES ==================== */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: particleFloat 2s ease-out forwards;
        }

        /* ==================== ANIMATIONS ==================== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes photoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes dots {
            0%, 20% {
                content: '';
            }
            40% {
                content: '.';
            }
            60% {
                content: '..';
            }
            80%, 100% {
                content: '...';
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes cakeDrop {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes candleWave {
            0%, 100% {
                transform: skewX(0deg);
            }
            50% {
                transform: skewX(3deg);
            }
        }

        @keyframes flameFlicker {
            0%, 100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(1.2);
            }
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        @keyframes particleFloat {
            to {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .birthday-message {
                font-size: 36px;
            }

            .personalized-message {
                font-size: 18px;
            }

            .login-card {
                padding: 30px 20px;
            }

            .login-photo {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-container" id="loginContainer">
        <div class="login-card">
            <img src="a441f0da-eaf7-4ec5-931f-fe135d6009f0.jpg" alt="Birthday Person" class="login-photo">
            <h1 class="login-title">🎂 Happy Birthday! 🎂</h1>
            <p class="login-subtitle">Enter the passcode to see the surprise</p>
            <input type="password" id="passcodeInput" class="passcode-input" placeholder="••••" maxlength="4">
            <button class="login-button" onclick="handleLogin()">Unlock Surprise</button>
            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div class="loading-container" id="loadingContainer">
        <div class="spinner"></div>
        <div class="loading-text">Loading your surprise<span class="dots"></span></div>
    </div>

    <!-- CELEBRATION SCREEN -->
    <div class="celebration-container" id="celebrationContainer">
        <div class="celebration-content">
            <div class="birthday-message">🎉 HAPPY BIRTHDAY! 🎉</div>
            
            <div class="cake-container">
                <div class="cake">
                    <div class="frosting"></div>
                    <div class="cake-base"></div>
                    <div class="cake-layer"></div>
                    <div class="candle"></div>
                    <div class="flame"></div>
                </div>
            </div>

            <div class="personalized-message" id="personalizedMessage">
                🌟 Wishing you a day filled with joy, laughter, and unforgettable moments! 🌟
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CORRECT_PASSCODE = "1234"; // Change this to your desired passcode
        const BIRTHDAY_NAME = "You"; // Change this to the birthday person's name
        const CUSTOM_MESSAGE = "Wishing you a day filled with joy, laughter, and unforgettable moments! May all your dreams come true today and always!"; // Custom birthday message

        // Element references
        const loginContainer = document.getElementById('loginContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const celebrationContainer = document.getElementById('celebrationContainer');
        const passcodeInput = document.getElementById('passcodeInput');
        const errorMessage = document.getElementById('errorMessage');
        const personalizedMessage = document.getElementById('personalizedMessage');

        // Update personalized message
        personalizedMessage.textContent = `🌟 ${CUSTOM_MESSAGE} 🌟`;

        // Handle Enter key
        passcodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        // Handle login
        function handleLogin() {
            const passcode = passcodeInput.value;
            errorMessage.textContent = '';

            if (passcode === CORRECT_PASSCODE) {
                // Correct passcode
                loginContainer.style.display = 'none';
                loadingContainer.classList.add('active');

                // Simulate loading time
                setTimeout(() => {
                    loadingContainer.classList.remove('active');
                    celebrationContainer.classList.add('active');
                    startCelebration();
                }, 2000);
            } else {
                // Wrong passcode
                errorMessage.textContent = '❌ Wrong passcode! Try again.';
                passcodeInput.value = '';
                passcodeInput.focus();
            }
        }

        // Start celebration effects
        function startCelebration() {
            createConfetti();
            createParticles();
        }

        // Create confetti
        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#a29bfe', '#fd79a8', '#fdcb6e', '#6c5ce7'];
            const confettiCount = 100;

            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 15 + 5 + 'px';
                    confetti.style.height = confetti.style.width;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                    confetti.style.opacity = Math.random() * 0.7 + 0.3;
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 30);
            }
        }

        // Create floating particles
        function createParticles() {
            const particleCount = 30;
            const emojis = ['🎉', '🎈', '🎂', '🎁', '🎊', '⭐', '✨', '🌟'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 50 + '%';
                particle.style.fontSize = Math.random() * 20 + 20 + 'px';
                
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 300;
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                particle.style.animationDelay = Math.random() * 0.3 + 's';

                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 3500);
            }
        }

        // Optional: Keep creating confetti for extended celebration
        setInterval(() => {
            if (celebrationContainer.classList.contains('active')) {
                createConfetti();
            }
        }, 2000);

        // Focus input on load
        passcodeInput.focus();
    </script>
</body>
</html>
